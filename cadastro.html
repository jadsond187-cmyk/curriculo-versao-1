<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">Jadson de Souza</div>
        <nav aria-label="Navegação do currículo">
            <a href="index.html">Sobre Mim</a>
            <a href="formacao.html">Formação</a>
            <a href="Portfólio.html">Portfólio</a>
            <a href="contato.html">Contato</a>
        </nav>
        <button id="temaBtn" type="button">🌙 Tema</button>
    </header>

    <main>
        <h1>Sistema de Segredos</h1>
        <aside>
            <p>Compartilhe um segredo e marque se ele é engraçado, triste, de amor ou nunca contei.</p>
        </aside>

        <section>
            <form action="/cadastro" method="POST">
                <label for="segredo">Segredo</label>
                <textarea
                    id="segredo"
                    name="segredo"
                    placeholder="Digite seu segredo..."
                    rows="4"
                    required></textarea>

                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione</option>
                    <option value="engraçado">Engraçado</option>
                    <option value="triste">Triste</option>
                    <option value="amor">Amor</option>
                    <option value="nunca contei">Nunca contei</option>
                </select>

                <button type="submit">
                    Enviar segredo
                </button>
            </form>
        </section>
    </main>

    <footer>
        <p>Os segredos enviados serão guardados com carinho.</p>
    </footer>
    <script>
        const temaBtn = document.getElementById("temaBtn");
        const temaSalvo = localStorage.getItem("curriculoTema");

        if (temaSalvo === "dark") {
            document.body.classList.add("dark");
        }

        temaBtn.addEventListener("click", () => {
            const temaEscuro = document.body.classList.toggle("dark");
            localStorage.setItem("curriculoTema", temaEscuro ? "dark" : "light");
        });
    </script>
</body>
</html>
