<body>

<header>
  <div class="logo">Jadson de Souza</div>
  <nav>
    <a href="index.html">Sobre Mim</a>
    <a href="formacao.html">Formação</a>
    <a href="Portfólio.html">Portfólio</a>
    <a href="contato.html">Contato</a>
  </nav>
  <button id="temaBtn">🌙 Tema</button>
</header>

<main>
  <section class="contact-wrapper">
    <div class="contact-card">
      <h1>Vamos conversar?</h1>
      <p>Se você é recrutador, cliente ou quer trabalhar comigo, pode me encontrar por estes canais:</p>

      <div class="contact-list">
        <a class="contact-link" href="mailto:seuemail@gmail.com">
          <span>📧</span>
          <span><strong>E-mail</strong><br>seuemail@gmail.com</span>
        </a>

        <a class="contact-link" href="tel:+5511999999999">
          <span>📞</span>
          <span><strong>Telefone</strong><br>+55 11 99999-9999</span>
        </a>

        <a class="contact-link" href="https://wa.me/5511999999999" target="_blank" rel="noopener">
          <span>💬</span>
          <span><strong>WhatsApp</strong><br>Converse comigo direto</span>
        </a>
      </div>
    </div>

    <div class="contact-card">
      <h2>Envie uma mensagem</h2>
      <form id="formulario">
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        <input type="email" id="email" name="email" placeholder="Seu e-mail" required>
        <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </section>
</main>

<script src="aprendendo.js"></script>

</body>
</html>
